# Verificação mensal dos links externos do Guia do Bolseiro.
# Corre no dia 1 de cada mês e pode ser lançada à mão no separador "Actions".
# Se encontrar links partidos, abre um aviso (issue) no repositório.
name: Verificação mensal de links

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 e 429: alguns sites públicos bloqueiam verificações automáticas;
          # não são tratados como erro (a revisão manual semestral cobre esses casos).
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept "200..=299,403,429"
            --exclude "google\.com/maps"
            index.html links-externos.txt
          output: ./lychee/relatorio.md
          fail: false

      - name: Abrir aviso se houver links partidos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Links partidos no Guia do Bolseiro"
          content-filepath: ./lychee/relatorio.md

